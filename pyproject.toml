[project]
name = "farm"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "import-linter>=2", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff.lint]
# Errors, undefined names, unused imports and import order. Style-only
# rewrites of reviewed code are deliberately out of scope for this gate.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
