[project]
name = "farm"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
    "pyserial>=3.5,<4",
    "pyudev>=0.24,<1",
    "opencv-python-headless>=4.10,<5",
    "numpy>=1.24,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "hypothesis>=6,<7",
    "import-linter>=2,<3",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]

[tool.ruff.lint]
# Errors, undefined names, unused imports and import order. Style-only
# rewrites of reviewed code are deliberately out of scope for this gate.
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
